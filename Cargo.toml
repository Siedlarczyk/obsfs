# ObsFS - Observability Filesystem

[workspace]
members = [
    "crates/obsfs-core",
    "crates/obsfs-fuse",
    "crates/obsfs-plugins",
    "crates/obsfs-cli",
]
resolver = "2"

[workspace.dependencies]
fuser = "0.14"
nix = { version = "0.29", features = ["mount", "signal", "process", "user"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
libc = "0.2"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Siedlarczyk/obsfs"
rust-version = "1.75"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
