name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-x86:
    name: Build x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          cd target/release
          tar -czvf ../../obsfs-${{ github.ref_name }}-x86_64-linux.tar.gz obsfs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsfs-x86_64-linux
          path: obsfs-*.tar.gz

  build-arm64:
    name: Build aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            rust:latest \
            bash -c "
              apt-get update && apt-get install -y libfuse3-dev pkg-config &&
              cargo build --release --locked
            "

      - name: Package
        run: |
          cd target/release
          tar -czvf ../../obsfs-${{ github.ref_name }}-aarch64-linux.tar.gz obsfs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsfs-aarch64-linux
          path: obsfs-*.tar.gz

  release:
    name: Create Release
    needs: [build-x86, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum obsfs-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/obsfs-*.tar.gz
            artifacts/checksums.txt
