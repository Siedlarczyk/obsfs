name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-x86:
    name: Build x86_64 (glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev patchelf

      - name: Build
        run: cargo build --release --locked

      - name: Bundle libraries
        run: |
          mkdir -p bundle/lib
          cp target/release/obsfs bundle/
          cp /usr/lib/x86_64-linux-gnu/libfuse3.so.3* bundle/lib/
          patchelf --set-rpath '$ORIGIN/lib' bundle/obsfs

      - name: Package tar.gz
        run: |
          cd bundle
          tar -czvf ../obsfs-${{ github.ref_name }}-x86_64-linux.tar.gz .

      - name: Package .deb
        run: |
          cd pkg/deb
          chmod +x build-deb.sh
          ./build-deb.sh ${{ github.ref_name }} amd64 ../../target/release/obsfs
          mv *.deb ../../

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsfs-x86_64-linux
          path: |
            obsfs-*.tar.gz
            obsfs_*.deb

  build-x86-musl:
    name: Build x86_64 (musl/Alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in Alpine container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            alpine:3.19 \
            sh -c "
              apk add --no-cache curl build-base fuse3-dev fuse3-static pkgconf musl-dev &&
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable &&
              source ~/.cargo/env &&
              RUSTFLAGS='-C target-feature=-crt-static' cargo build --release --locked &&
              strip target/release/obsfs
            "

      - name: Package tar.gz
        run: |
          mkdir -p bundle
          cp target/release/obsfs bundle/
          cd bundle
          tar -czvf ../obsfs-${{ github.ref_name }}-x86_64-linux-musl.tar.gz obsfs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsfs-x86_64-linux-musl
          path: obsfs-*-musl.tar.gz

  build-arm64:
    name: Build aarch64 (glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:bookworm \
            bash -c "
              apt-get update &&
              apt-get install -y curl build-essential libfuse3-dev pkg-config patchelf &&
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
              . ~/.cargo/env &&
              cargo build --release --locked &&
              mkdir -p bundle/lib &&
              cp target/release/obsfs bundle/ &&
              cp /usr/lib/aarch64-linux-gnu/libfuse3.so.3* bundle/lib/ &&
              patchelf --set-rpath '\$ORIGIN/lib' bundle/obsfs
            "

      - name: Package tar.gz
        run: |
          cd bundle
          tar -czvf ../obsfs-${{ github.ref_name }}-aarch64-linux.tar.gz .

      - name: Package .deb
        run: |
          cd pkg/deb
          chmod +x build-deb.sh
          ./build-deb.sh ${{ github.ref_name }} arm64 ../../target/release/obsfs
          mv *.deb ../../

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsfs-aarch64-linux
          path: |
            obsfs-*.tar.gz
            obsfs_*.deb

  build-arm64-musl:
    name: Build aarch64 (musl/Alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Alpine ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            alpine:3.19 \
            sh -c "
              apk add --no-cache curl build-base fuse3-dev fuse3-static pkgconf musl-dev &&
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable &&
              source ~/.cargo/env &&
              RUSTFLAGS='-C target-feature=-crt-static' cargo build --release --locked &&
              strip target/release/obsfs
            "

      - name: Package tar.gz
        run: |
          mkdir -p bundle
          cp target/release/obsfs bundle/
          cd bundle
          tar -czvf ../obsfs-${{ github.ref_name }}-aarch64-linux-musl.tar.gz obsfs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsfs-aarch64-linux-musl
          path: obsfs-*-musl.tar.gz

  release:
    name: Create Release
    needs: [build-x86, build-x86-musl, build-arm64, build-arm64-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum obsfs-*.tar.gz obsfs_*.deb > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/obsfs-*.tar.gz
            artifacts/obsfs_*.deb
            artifacts/checksums.txt
